<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#111111;color:#FFFFFF;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.35;padding:16px 12px 32px}
.page{max-width:960px;margin:0 auto}
.haut,.barre,.tete{display:flex;justify-content:space-between;gap:12px}
.haut,.barre{align-items:center}
h1{font-size:20px;font-weight:bold;text-transform:uppercase}
.logo{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:contain}
.barre{margin:14px 0 16px}
.maj{font-size:13px;color:#D9D9D9}
.maj b{display:block;color:#FFFFFF;font-size:15px}
.ancien{display:block;color:#FFFFFF;font-size:13px;font-weight:bold;margin-top:2px}
.ancien[hidden]{display:none}
button{background:#F26910;color:#1A1A1A;border:0;border-radius:8px;font:bold 15px Arial,Helvetica,sans-serif;text-transform:uppercase;min-height:48px;padding:0 18px}
button:disabled{opacity:.6}
.grille{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.carte{background:#1F1F1F;border-radius:12px;padding:14px}
h2{color:#F26910;font-size:22px;font-weight:bold;text-transform:uppercase}
.poule,.bilan,.salle,.note{font-size:13px;color:#D9D9D9}
.rang{text-align:right;white-space:nowrap;font-size:13px;color:#D9D9D9}
.rang b{display:block;color:#F26910;font-size:28px;line-height:1}
.proch{background:#111111;border-radius:8px;padding:10px 12px;margin:12px 0}
.pastille{display:inline-block;background:#F26910;color:#1A1A1A;font-size:11px;font-weight:bold;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.quand{font-size:18px;font-weight:bold;text-transform:uppercase;margin-top:8px}
.qui,.salle,.note{margin-top:4px}
.lieu{display:inline-block;border:1px solid #D9D9D9;border-radius:4px;font-size:11px;font-weight:bold;padding:1px 6px;margin-right:6px}
.res{list-style:none;padding:0}
.res li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.vd{flex:none;width:28px;height:28px;border-radius:50%;color:#FFFFFF;font-weight:bold;font-size:14px;display:flex;align-items:center;justify-content:center}
.v{background:#1E7A3C}.d{background:#B3261E}
.sc{flex:none;width:34px;font-weight:bold;line-height:28px}
.adv{font-size:14px;line-height:1.3;padding-top:5px}
.adv small{display:block;font-size:12px;color:#D9D9D9}
h3{font-size:16px;font-weight:bold;text-transform:uppercase;margin-top:14px}
h3 small{display:block;font-size:13px;font-weight:normal;text-transform:none;color:#D9D9D9}
.encart{margin-top:16px;border-top:1px solid #6B6B6B;padding-top:12px}
.encart p{font-size:13px;color:#D9D9D9;margin-top:4px}
.nonlu{display:inline-block;border:1px solid #D9D9D9;border-radius:4px;font-size:11px;font-weight:bold;text-transform:uppercase;padding:1px 6px;margin-top:6px}
.choix{margin:0 0 12px}
select{display:block;width:100%;height:48px;background:#1F1F1F;color:#FFFFFF;border:1px solid #D9D9D9;border-radius:8px;font:16px Arial,Helvetica,sans-serif;padding:0 12px;color-scheme:dark}
option{background:#1F1F1F;color:#FFFFFF}
option:checked{background:#F26910;color:#1A1A1A}
.lien-coupe{display:flex;align-items:center;min-height:48px;margin:0 0 12px;padding:0 14px;background:#1F1F1F;border:1px solid #F26910;border-radius:8px;color:#FFFFFF;font-size:15px;font-weight:bold;text-decoration:none}
.lien-coupe[hidden]{display:none}
.lien-coupe::after{content:"\203A";margin-left:auto;font-size:24px;line-height:1}
button:focus-visible,select:focus-visible,.lien-coupe:focus-visible,.lien-poule:focus-visible{outline:3px solid #F26910;outline-offset:2px}
.grille.une{grid-template-columns:minmax(0,560px)}
h3 .pastille{margin-left:8px;vertical-align:middle}
.mts{list-style:none;padding:0}
.mt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #6B6B6B}
.mt:first-child{border-top:0}
.hre{flex:none;width:58px;font-size:15px;font-weight:bold;line-height:28px}
.hre.sans{font-size:12px;font-weight:normal;color:#D9D9D9}
.mt-txt{flex:1;min-width:0}
.mt-carte{font-size:13px;font-weight:bold;text-transform:uppercase}
.nav{display:flex;gap:8px;margin:12px 0 8px}
.nav button{min-width:48px;padding:0 14px;font-size:22px}
.nav .aujourdhui{flex:1;font-size:15px}
.bascule{display:block;width:100%;background:#111111;color:#FFFFFF;border:1px solid #D9D9D9;margin-bottom:8px}
.bascule[aria-pressed="true"]{background:#F26910;color:#1A1A1A;border-color:#F26910}
.jours h3:first-child{margin-top:8px}
.pl{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:14px}
.pl .h{flex:none;width:58px;font-size:15px;font-weight:bold;line-height:28px}
.pl .h.sans{font-size:12px;font-weight:normal;color:#D9D9D9;line-height:1.2}
.pl-txt{flex:1;min-width:0;padding-top:5px}
.pl-txt small{display:block;font-size:12px;color:#D9D9D9}
.lien-poule{display:flex;align-items:center;min-height:48px;margin-top:12px;padding:0 14px;background:#111111;border:1px solid #F26910;border-radius:8px;color:#FFFFFF;font-size:15px;font-weight:bold;text-decoration:none}
.lien-poule::after{content:"\203A";margin-left:auto;font-size:24px;line-height:1}
.carte>.lien-poule:first-child{margin:0 0 12px}
.bloc{margin-top:16px}
.bloc>h3:first-child{margin-top:0}
.cl{list-style:none;padding:0;margin-top:8px}
.cl li{display:grid;grid-template-columns:26px minmax(0,1fr) 34px 26px 26px 26px;gap:4px;align-items:center;padding:8px 6px;border-top:1px solid #6B6B6B;font-size:14px}
.cl li.tete{border-top:0;font-size:12px;font-weight:bold;color:#D9D9D9;text-transform:uppercase}
.cl li.moi{background:#111111;border-left:4px solid #F26910;font-weight:bold}
.cl .num{text-align:right}
.cl .pts{font-weight:bold}
.mt.moi .qui{font-weight:bold}
.journees{margin-top:4px}
</style>

function jour(iso){const [a,m,j]=iso.split("-").map(Number);return JOURS[new Date(Date.UTC(a,m-1,j)).getUTCDay()]+" "+j+" "+MOIS[m-1]}

function aujourdhuiParis(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris"}).format(new Date())}
function blocProchain(m,note,lu){
  const p=el("div","proch");p.append(el("span","pastille","Prochain match"));

  const dom=m.dom===nous,o={date:m.date,heure:texte(m.heure),saisie:heureHM(m.heure_saisie),lieu:dom?"D":"E",adv:dom?m.ext:m.dom,salle:texte(m.salle)};
  if(typeof m.sd==="number"&&typeof m.se==="number"){
    o.pour=dom?m.sd:m.se;o.contre=dom?m.se:m.sd;
    o.sets=typeof m.sets==="string"?m.sets.split(" ").filter(Boolean).map(s=>dom?s:s.split("-").reverse().join("-")).join(" "):""}
  else if(m.illisible||m.sd!=null||m.se!=null)o.illisible=true; // forfait, ou score qui n'est pas un nombre : jamais deviné

// Tous les matchs d'une carte. Source : « poules » (toute la saison). À défaut (ancien data.json, copie intégrée),
// resultats / avenir (ou prochain) / attente : rien d'inventé, on ne sait alors ni exempt ni plateau.
function matchsDeCarte(q){
  if(!q||typeof q!=="object")throw new Error("carte illisible");
  const out=[],liste=x=>Array.isArray(x)?x:[],date=m=>m&&typeof m.date==="string"&&ISO.test(m.date);
  if(Array.isArray(q.poules)&&q.poules.length){
    q.poules.forEach((p,i)=>{
      if(!p||typeof p.nous!=="string"||!Array.isArray(p.matchs))throw new Error("poule illisible");
      p.matchs.forEach(m=>{if(date(m)&&(m.dom===p.nous||m.ext===p.nous))out.push({...vueClub(m,p.nous),poule:i})})});
    return out}
  const base=m=>({date:m.date,heure:texte(m.heure),saisie:heureHM(m.heure_saisie),lieu:m.lieu,adv:m.adv,salle:texte(m.salle),poule:0});
  liste(q.resultats).filter(date).forEach(r=>out.push({...base(r),pour:r.pour,contre:r.contre,sets:typeof r.sets==="string"?r.sets:"",res:true}));
  (Array.isArray(q.avenir)?q.avenir:(q.prochain?[q.prochain]:[])).filter(date).forEach(m=>out.push(base(m)));
  liste(q.attente).filter(date).forEach(m=>out.push({...base(m),illisible:!!m.illisible}));

function lignesCarte(q,nom,ordre){

// Lignes de toutes les cartes (équipes puis coupes). Une carte illisible n'abîme que sa propre part.
function lignesProgramme(d){
  const cartes=d.equipes.map(q=>[q,q&&q.nom]).concat((d.coupes||[]).map(k=>[k,k&&typeof k.nom==="string"?(k.equipe?k.equipe+" · ":"")+k.nom:null]));
  const lignes=[];let illisibles=0;
  cartes.forEach(([q,nom],i)=>{
    try{lignes.push(...lignesCarte(q,nom,i))}
    catch(e){illisibles++}});
  return{lignes,illisibles}}
// Plateau : une équipe a au moins deux lignes le même jour dans la même poule (exempt compris). Qui reçoit : « VBG » si
// toutes les salles sont les nôtres (liste « salles_club », nom entier, casse ignorée) ET qu'une des lignes nous met
// à domicile pour FFvolley (« SALLE DU COSEC » existe aussi chez d'autres clubs : une salle seule ne prouve rien) ;
// sinon le nom de la salle ; rien si la salle n'est plus publiée (match joué) ou si elles diffèrent : jamais deviné.
function lieuPlateau(vrais,salles){
  const s=[...new Set(vrais.map(x=>x.salle).filter(Boolean))],bas=salles.map(x=>String(x).toLowerCase());
  if(!s.length)return null;
  if(s.every(x=>bas.includes(x.toLowerCase()))&&vrais.some(x=>x.lieu==="D"))return "VBG";
  return s.length===1?s[0]:null}
function trier(a,b){return a<b?-1:a>b?1:0}
function blocsDuJour(ls,salles){
  const groupes=new Map();
  ls.forEach(x=>{if(!groupes.has(x.cle))groupes.set(x.cle,[]);groupes.get(x.cle).push(x)});
  return[...groupes.values()].map(g=>{
    const vrais=g.filter(x=>!x.exempt).sort((a,b)=>trier(heureAff(a)||"99:99",heureAff(b)||"99:99")),plateau=g.length>=2;
    return{ls:g,vrais,exempt:g.some(x=>x.exempt),plateau,lieu:plateau?lieuPlateau(vrais,salles):null,
           heure:(vrais.map(heureAff).find(Boolean))||null,ordre:g[0].ordre,carte:g[0].carte,nonlu:g[0].nonlu,lu:g[0].lu}})
    .sort((a,b)=>trier(a.heure||"99:99",b.heure||"99:99")||a.ordre-b.ordre)}
// Filtre « À domicile » : hors plateau, le domicile de FFvolley (fiable) ; sur un plateau, la salle seule décide.
function estDomicile(b){return b.plateau?b.lieu==="VBG":(!b.exempt&&b.ls[0].lieu==="D")}
function heureTxt(h){return h.replace(":"," h ")}
function pastilleVD(x){const v=x.pour>x.contre;return el("span","vd "+(v?"v":"d"),v?"V":"D")}
function statutMatch(x,auj,h){
  if(aScore(x))return null;

  return dejaJoue(x,auj,h)?"Résultat pas encore publié sur FFvolley":null}
function noteNonLu(b){return b.nonlu?el("p","note","non lu"+(b.lu?" depuis le "+dateLue(b.lu):"")):null}
function liSimple(b,auj,h,sansCarte){
  const x=b.ls[0],li=el("li","mt"),g=el("span","hre"),t=el("div","mt-txt");
  if(!sansCarte)t.append(el("p","mt-carte",b.carte));
  if(b.exempt){g.className="hre sans";t.append(el("p","qui","Exempt"))}
  else{
    if(typeof x.adv!=="string"||(x.res&&!aScore(x)))throw new Error("ligne illisible");
    if(aScore(x))g.append(pastilleVD(x));
    else if(x.heure)g.textContent=heureTxt(x.heure);
    else if(x.saisie)g.textContent=heureTxt(x.saisie);

    if(x.lieu==="D"||x.lieu==="E")qui.append(el("span","lieu",x.lieu==="D"?"Domicile":"Extérieur"));
    qui.append(x.adv);t.append(qui);

    if(!aScore(x)&&!x.heure&&x.saisie)t.append(el("p","note",SAISIE_VBG));
    const s=statutMatch(x,auj,h);if(s)t.append(el("p","note",s))}

// Plateau : une seule mention « Plateau » (qui reçoit), puis une ligne par match, sans domicile/extérieur.
function liPlateau(b,auj,h,sansCarte){
  const li=el("li","mt"),g=el("span","hre sans"),t=el("div","mt-txt"),qui=el("p","qui");
  qui.append(el("span","lieu","Plateau"));if(b.lieu)qui.append(b.lieu);

    const r=el("div","pl"),q=el("span","pl-txt",x.adv),h1=el("span","h");
    if(aScore(x))h1.append(pastilleVD(x));

    else{h1.className="h sans";h1.textContent="Heure à confirmer"}
    if(aScore(x))q.append(el("small",null,x.pour+"–"+x.contre+(x.sets?" · "+x.sets:"")));
    if(!aScore(x)&&!x.heure&&x.saisie)q.append(el("small",null,SAISIE_VBG));
    const s=statutMatch(x,auj,h);if(s)q.append(el("small",null,s));
    r.append(h1,q);t.append(r)});

  li.append(g,t);return li}
const SEM_PROG={debut:null,dom:false}; // semaine affichée (null : celle d'aujourd'hui) et filtre « À domicile »
function carteProgramme(d){
  const c=el("article","carte"),poule=el("p","poule"),nav=el("div","nav"),zone=el("div","jours");
  const prec=el("button",null,"‹"),suiv=el("button",null,"›"),auj_b=el("button","aujourdhui","Aujourd'hui"),dom=el("button","bascule","À domicile");
  prec.setAttribute("aria-label","Semaine précédente");suiv.setAttribute("aria-label","Semaine suivante");
  nav.append(prec,auj_b,suiv);c.append(el("h2",null,"Programme"),poule,nav,dom,zone);
  let courant=null;
  const salles=Array.isArray(d.salles_club)?d.salles_club:[];
  function maj(){
    const auj=aujourdhuiParis(),h=heureParis(),lundiAuj=semaineDe(auj).debut,{lignes,illisibles}=lignesProgramme(d);
    const dates=lignes.map(x=>x.date).sort(),premier=dates.length?semaineDe(dates[0]).debut:lundiAuj,dernier=dates.length?semaineDe(dates[dates.length-1]).debut:lundiAuj;
    const min=premier<lundiAuj?premier:lundiAuj,max=dernier>lundiAuj?dernier:lundiAuj; // la semaine d'aujourd'hui reste toujours accessible
    courant=SEM_PROG.debut||lundiAuj;if(courant<min)courant=min;if(courant>max)courant=max;
    const fin=ajouterJours(courant,6);
    poule.textContent="Du "+court(courant)+" au "+court(fin);
    prec.disabled=courant<=min;suiv.disabled=courant>=max;auj_b.disabled=courant===lundiAuj;
    dom.setAttribute("aria-pressed",SEM_PROG.dom?"true":"false");
    const semaine=lignes.filter(x=>x.date>=courant&&x.date<=fin),jours=[...new Set(semaine.map(x=>x.date))].sort();
    const noeuds=[];let masquesJoues=0,affiches=0;
    jours.forEach(j=>{
      let blocs=blocsDuJour(semaine.filter(x=>x.date===j),salles);
      if(SEM_PROG.dom){
        masquesJoues+=blocs.filter(b=>!estDomicile(b)&&b.plateau&&b.lieu===null&&b.vrais.some(aScore)).length;
        blocs=blocs.filter(estDomicile)}

      if(j===auj)t.append(el("span","pastille","Aujourd'hui"));
      blocs.forEach(b=>{affiches++;let li;try{li=b.plateau?liPlateau(b,auj,h):liSimple(b,auj,h)}catch(e){li=el("li","mt");li.append(el("p","note","Ligne illisible."))}ul.append(li)});
      noeuds.push(t,ul)});
    if(!affiches)noeuds.push(el("p","qui",SEM_PROG.dom?"Aucun match à domicile cette semaine.":"Aucun match du club cette semaine."));
    if(masquesJoues)noeuds.push(el("p","note",masquesJoues+" plateau(x) déjà joué(s) masqué(s) : leur salle n'est plus publiée."));
    if(illisibles)noeuds.push(el("p","note","Données illisibles pour "+illisibles+" carte(s)."));
    zone.replaceChildren(...noeuds)}
  // Le bouton cliqué peut devenir inactif (borne, semaine d'aujourd'hui) : le focus clavier passe à un bouton actif.
  function apres(b){maj();if(b.disabled){const autre=[prec,suiv,auj_b,dom].find(x=>!x.disabled);if(autre)autre.focus()}}
  // Revenir à la semaine d'aujourd'hui remet « null » : la page la suit alors au changement de date de Paris.
  function aller(lundi){SEM_PROG.debut=lundi===semaineDe(aujourdhuiParis()).debut?null:lundi}
  prec.addEventListener("click",()=>{aller(ajouterJours(courant,-7));apres(prec)});
  suiv.addEventListener("click",()=>{aller(ajouterJours(courant,7));apres(suiv)});
  auj_b.addEventListener("click",()=>{SEM_PROG.debut=null;apres(auj_b)});
  dom.addEventListener("click",()=>{SEM_PROG.dom=!SEM_PROG.dom;apres(dom)});
  maj();return c}
// ---- Vue « Poule » : classement complet, nos matchs restants, toute la poule. Adresse #poule-<équipe> (ex. #poule-n3m) ----

const ETAT_POULE={toute:false}; // « Toute la poule » ouverte ou non

// Une ligne de « Toute la poule » : « A – B », puis score et sets (du point de vue de celui qui reçoit) ou heure et salle.

function journeesDePoule(p,q){

// Dans les 7 jours (date de Paris, matchs à venir seulement) : la carte Coupes passe en tête.
function coupeProche(cs){
  const auj=aujourdhuiParis().split("-").map(Number);
  const t0=Date.UTC(auj[0],auj[1]-1,auj[2]);
  return cs.some(k=>{try{const [a,m,j]=k.prochain.date.split("-").map(Number);const n=(Date.UTC(a,m-1,j)-t0)/864e5;return n>=0&&n<=7}catch(e){return false}})}

// Données anciennes : écart en jours de calendrier à Paris entre la dernière collecte (maj) et aujourd'hui.

function joursDepuis(maj){
  // Seul le format écrit par le collecteur est accepté (ISO avec décalage) : jamais de date devinée par le navigateur.
  if(typeof maj!=="string"||!/^\d{4}-\d\d-\d\dT\d\d:\d\d(:\d\d(\.\d+)?)?(Z|[+-]\d\d:\d\d)$/.test(maj))return null;
  const t=new Date(maj);if(isNaN(t.getTime()))return null;
  const a=jourParis(t).split("-").map(Number),b=aujourdhuiParis().split("-").map(Number);
  return Math.round((Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2]))/864e5)}
function signalerAncien(){
  const e=document.getElementById("ancien");let n=null;
  try{n=joursDepuis(donnees&&donnees.maj)}catch(x){}
  const ancien=n!==null&&n>SEUIL_ANCIEN;
  e.textContent=ancien?"Données anciennes : dernière collecte il y a "+n+" jours":"";e.hidden=!ancien}
let donnees=null,choix=null,jourRendu=null;
function rendre(){
  const d=donnees,cs=d.coupes||[],o=listeVues(d);
  jourRendu=aujourdhuiParis();
  signalerAncien();
  choix=valide(o,choix)||vueInitiale(o,lireAdresse(),lireChoix());
  // Une donnée illisible n'abîme que sa propre carte, jamais la page ni le menu.
  const sure=(f,nom)=>{try{return f()}catch(e){const c=el("article","carte");c.append(el("h2",null,nom),el("p","note","Données de cette carte illisibles."));return c}};
  const carteSure=q=>sure(()=>carte(q),q.nom);
  let cartes;
  if(choix==="programme")cartes=[sure(()=>carteProgramme(d),"Programme")];
  else if(choix==="toutes"){cartes=d.equipes.map(carteSure);if(cs.length){const k=sure(()=>carteCoupes(cs),"Coupes");if(coupeProche(cs))cartes.unshift(k);else cartes.push(k)}}
  else if(choix==="coupes")cartes=[sure(()=>carteCoupes(cs),"Coupes")];
  else if(estPoule(choix)){const q=equipeDePoule(d,choix);cartes=[sure(()=>cartePoule(q,d),q.nom)]}
  else cartes=[carteSure(d.equipes.find(x=>slug(x.nom)===choix))];
  const g=document.getElementById("grille");g.className="grille"+(cartes.length===1?" une":"");g.replaceChildren(...cartes);
  const sel=document.getElementById("vue");
  sel.replaceChildren(...o.map(x=>{const op=el("option",null,x.t);op.value=x.v;return op}));sel.value=estPoule(choix)?choix.slice(PREFIXE_POULE.length):choix;
  document.getElementById("lien-coupe").hidden=!(choix!=="programme"&&choix!=="toutes"&&choix!=="coupes"&&!estPoule(choix)&&cs.length&&coupeProche(cs));
  ecrireAdresse(choix)}
function changer(v){choix=v;ecrireChoix(v);rendre()}
// Au retour sur la page : si la date de Paris a changé depuis le dernier affichage, tout est recalculé (sans requête).
function reprise(){
  if(!donnees)return;
  try{if(document.visibilityState==="hidden")return;if(aujourdhuiParis()!==jourRendu)rendre()}catch(e){}}
function afficher(d,libelle){
  // Seul l'essentiel est exigé ; le reste est toléré carte par carte.
  d={...d,equipes:(Array.isArray(d.equipes)?d.equipes:[]).filter(q=>q&&typeof q.nom==="string"&&slug(q.nom)),
     coupes:(Array.isArray(d.coupes)?d.coupes:[]).filter(k=>k&&typeof k==="object")};
  if(!d.equipes.length)throw new Error("aucune équipe");
  let maj="–";try{maj=new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(d.maj))}catch(e){}
  document.getElementById("src").textContent=libelle;
  document.getElementById("maj").textContent=maj;
  const ns=d.nonsuivies||[],en=document.getElementById("encart");
  en.replaceChildren(...ns.map(n=>el("p",null,"Compétition non suivie : "+n.code+", "+n.libelle)));en.hidden=!ns.length;
  donnees=d;rendre()}
async function actualiser(){
  const b=document.getElementById("btn");b.disabled=true;
  const c=new AbortController(),t=setTimeout(()=>c.abort(),10000); // pas d'attente infinie
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store",signal:c.signal});if(!r.ok)throw 0;afficher(await r.json(),"Dernière mise à jour")}
  catch(e){
    // Hors ligne : on garde les données déjà affichées ; les données intégrées ne servent qu'au premier chargement.
    if(donnees){document.getElementById("src").textContent="Actualisation impossible, données du";reprise()}
    else{try{afficher(SECOURS,"Données intégrées du")}catch(e2){}}}
  finally{clearTimeout(t);b.disabled=false}}
document.getElementById("btn").addEventListener("click",actualiser);
document.getElementById("vue").addEventListener("change",e=>changer(e.target.value));
document.getElementById("lien-coupe").addEventListener("click",e=>{
  e.preventDefault();changer("coupes");
  // la ligne disparaît de la vue Coupes : le focus clavier passe au menu (anneau orange) au lieu d'être perdu
  try{document.getElementById("vue").focus()}catch(x){}});
document.addEventListener("visibilitychange",reprise);
window.addEventListener("pageshow",reprise);
window.addEventListener("hashchange",()=>{if(!donnees)return;const v=valide(listeVues(donnees),lireAdresse());if(v&&v!==choix){choix=v;ecrireChoix(v);rendre()}else ecrireAdresse(choix)});
actualiser();
</script>
